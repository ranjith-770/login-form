<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Validation</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container">
    <!-- Registration Form -->
    <!-- novalidate disables default browser popups so your JS logic runs -->
    <form id="signup-form" novalidate>
      <h2>Create Account</h2>

      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your full name" />
        <small class="error-msg"></small>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com" />
        <small class="error-msg"></small>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 chars & 1 number" />
        <small class="error-msg"></small>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter your password" />
        <small class="error-msg"></small>
      </div>

      <button type="submit" id="submit-btn">Submit</button>
    </form>

    <!-- Success Message Container (Hidden by default) -->
    <div id="success-box" class="hidden">
      <div class="success-icon">✓</div>
      <h2>Registration Successful!</h2>
      <p>Your account has been created successfully.</p>
    </div>
  </div>

</body>
</html>
